# vim:ft=kitty

## name:     Neutral dark (Catppuccin ANSI palette)
## author:   Pocco81 (https://github.com/Pocco81)
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/mocha.conf
## blurb:    Grayscale interface; original ANSI colors retained for terminal output.

# The basic colors
foreground              #D8D8D8
background              #000000
selection_foreground    #101010
selection_background    #D8D8D8

# Cursor colors
cursor                  #EEEEEE
cursor_text_color       #101010

# URL underline color when hovering with mouse
url_color               #D8D8D8

# Kitty window border colors
active_border_color     #D8D8D8
inactive_border_color   #606060
bell_border_color       #FFFFFF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #101010
active_tab_background   #D8D8D8
inactive_tab_foreground #A0A0A0
inactive_tab_background #202020
tab_bar_background      #101010

# Colors for marks (marked text in the terminal)
mark1_foreground #101010
mark1_background #EEEEEE
mark2_foreground #101010
mark2_background #B0B0B0
mark3_foreground #101010
mark3_background #808080

# The 16 terminal colors

# black
color0 #45475A
color8 #585B70

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8
