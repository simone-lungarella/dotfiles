$color = rgba(16,16,16,1.0)
$inner_color = rgba(16,16,16,0.9)
$outer_color = rgba(160,160,160,1.0)
$font_color = rgba(238,238,238,1.0)
$muted_color = rgba(176,176,176,1.0)

$font = IoskeleyMono Nerd Font

general {
  hide_cursor = true
  ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = $HOME/Pictures/1-scenery-pink.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.0
    noise = 0.0
}

animations {
    enabled = true
}

input-field {
  monitor =
  size = 460, 84
  outline_thickness = 2
  rounding = 8
  dots_size = 0.3
  dots_spacing = 0.2
  dots_center = true
  outer_color = $outer_color
  inner_color = $inner_color
  font_color = $font_color
  font_family = $font
  fade_on_empty = false
  placeholder_text = <span size="20pt">Password</span>
  hide_input = false
  check_color = $font_color
  check_text = <span size="18pt">Checking...</span>
  fail_color = $font_color
  fail_text = <span size="18pt">Try again ($ATTEMPTS)</span>
  capslock_color = rgba(255,255,255,1.0)
  position = 0, -40
  halign = center
  valign = center
}

# Keep the clock, date, and input together in the middle of each display.
label {
  monitor =
  text = $TIME
  color = $font_color
  font_size = 64
  font_family = $font
  position = 0, 150
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B"
  color = $muted_color
  font_size = 18
  font_family = $font
  position = 0, 80
  halign = center
  valign = center
}

label {
  monitor =
  text = Enter to unlock · Ctrl+U to clear
  color = $muted_color
  font_size = 12
  font_family = $font
  position = 0, -110
  halign = center
  valign = center
}
